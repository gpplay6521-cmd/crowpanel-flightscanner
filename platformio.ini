; CrowPanel Advance 4.3" (ESP32-S3-WROOM-1-N16R8, HW V1.1) - FlightScanner
; Toolchain pins follow Elecrow's V1.1_and_V1.2_and_V1.3/PlatformIO example.

; pioarduino replaces the stock "espressif32" platform. If you use PlatformIO for other
; ESP32 projects, keep this one in its own core dir by setting PLATFORMIO_CORE_DIR
; (e.g. C:/pio-crowpanel) before building, so the global install is left alone.
; On Windows, build from a path without non-ASCII characters (the linker cannot write
; its map file there), or point PLATFORMIO_BUILD_DIR at an ASCII path.

[env:crowpanel43]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = ESP32-S3-WROOM-1-N16R8
framework = arduino
monitor_speed = 115200
board_build.arduino.partitions = partitions.csv
board_upload.partitions = partitions.csv
build_flags =
	-DCONFIG_SPIRAM_SPEED_120M=1
	-I include
lib_deps =
	lovyan03/LovyanGFX@1.2.26
	bblanchon/ArduinoJson@^7.4.0
